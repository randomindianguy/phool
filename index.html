<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#24140c" />
    <meta name="description" content="Prototype of a cottage memory wall with one 360 photo collection and four local videos." />
    <title>The memory wall</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="experience" data-stage="door">
      <section class="door-stage" aria-label="A cottage door at night">
        <div class="door-image door-image--open" aria-hidden="true"></div>
        <div class="door-image door-image--closed" aria-hidden="true"></div>
        <div class="door-light" aria-hidden="true"></div>
        <button class="door-hit" type="button" aria-label="Open the cottage door"></button>
      </section>

      <section class="wall-stage" aria-label="A cottage room with five framed memories">
        <div class="wall-art" aria-hidden="true"></div>
        <div class="room-shade" aria-hidden="true"></div>

        <svg class="willow-thread" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <filter id="thread-glow" x="-80%" y="-80%" width="260%" height="260%">
              <feGaussianBlur stdDeviation="0.78" result="wide-blur" />
              <feGaussianBlur in="SourceGraphic" stdDeviation="0.2" result="near-blur" />
              <feMerge>
                <feMergeNode in="wide-blur" />
                <feMergeNode in="near-blur" />
                <feMergeNode in="SourceGraphic" />
              </feMerge>
            </filter>
          </defs>
          <path class="rope rope--halo" d="M-3 91 C11 85 24 90 37 85 C47 81 53 75 52 68 C51 62 49 58 49 53" />
          <path id="rope-route" class="rope rope--core" d="M-3 91 C11 85 24 90 37 85 C47 81 53 75 52 68 C51 62 49 58 49 53" />
          <path class="rope rope--glints" d="M-3 91 C11 85 24 90 37 85 C47 81 53 75 52 68 C51 62 49 58 49 53" />
          <circle class="rope-spark rope-spark--one" r="0.24">
            <animateMotion dur="7s" repeatCount="indefinite"><mpath href="#rope-route" /></animateMotion>
          </circle>
        </svg>

        <div class="frame-hits" aria-label="Interactive picture frames">
          <button class="frame-hit frame-hit--main" data-action="gallery" type="button" aria-label="Open the 360 degree photo collection">
            <span>See every photo</span>
          </button>
          <button class="frame-hit frame-hit--video frame-hit--tl" data-video="1" type="button" aria-label="Play local video one"><span><b aria-hidden="true">▶</b></span></button>
          <button class="frame-hit frame-hit--video frame-hit--bl" data-video="2" type="button" aria-label="Play local video two"><span><b aria-hidden="true">▶</b></span></button>
          <button class="frame-hit frame-hit--video frame-hit--tr" data-video="3" type="button" aria-label="Play local video three"><span><b aria-hidden="true">▶</b></span></button>
          <button class="frame-hit frame-hit--video frame-hit--br" data-video="4" type="button" aria-label="Play local video four"><span><b aria-hidden="true">▶</b></span></button>
        </div>
      </section>

      <section class="gallery-overlay" aria-label="360 degree photo collection" aria-hidden="true">
        <button class="overlay-close" data-close-overlay type="button">Back to the wall</button>
        <p class="gallery-kicker">The pictures around you</p>

        <div class="gallery gallery--orbit">
          <div class="orbit-scene" id="orbit-scene"></div>
          <p>Drag, scroll, or use the arrows to turn the circle.</p>
        </div>

        <div class="gallery-controls">
          <button id="gallery-previous" type="button" aria-label="Previous photo">←</button>
          <span id="gallery-count">01 / 08</span>
          <button id="gallery-next" type="button" aria-label="Next photo">→</button>
        </div>
      </section>

      <section class="video-overlay" aria-label="Local video player" aria-hidden="true">
        <button class="overlay-close" data-close-overlay type="button">Back to the wall</button>
        <div class="video-placeholder">
          <span class="video-play" aria-hidden="true">▶</span>
          <strong id="video-title">Local video 1</strong>
          <small>Its MP4 will play here, full-screen and with sound.</small>
        </div>
      </section>

      <p class="invitation" aria-live="polite"><span class="invitation-dot" aria-hidden="true"></span><span id="invitation-copy">Open the door</span></p>

    </main>
    <script src="./app.js?v=4"></script>
  </body>
</html>
